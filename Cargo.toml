[package]
name = "yoink"
version = "3.2.1"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
regex = "1.11"
walkdir = "2.5"
which = "7.0"
ratatui = "0.29"
crossterm = "0.28"
ansi-to-tui = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.16"
